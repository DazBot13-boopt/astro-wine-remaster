<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OREAC — Astro Wine Remaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    .hero {
      min-height: 72vh;
      display: grid;

    .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="app">
    <section class="hero">
      <h1>Astrologie &amp; Horoscope</h1>
      <p>
        Remaster Wine : lecture propre du portrait et des horoscopes,

      </p>
      <div class="cta tabs">
        <a href="portrait.html">Ouvrir le portrait</a>
        <a href="horoscope.html" class="ghost">Horoscopes par signe</a>
